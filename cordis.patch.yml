# ============================================================================
# dsh-image-gen — AI 在对话里直接生图
# ============================================================================
# 本层只插入一个插件行。接入点/模型与 API Key 不放这里（这是可分享、可提交的
# 装配层），而是落在 $DSH_HOME/dsh-image-gen/config.json（0600，仅本机）。
#
# 卸载本层时下面的 insert 行随之回滚，config.json 与已生成的图片仍留在磁盘上。
#
# 可选配置（不填就走默认）：
#   dir: 配置与图片的根目录，默认 $DSH_HOME/dsh-image-gen
# ============================================================================

- insert:
    - id: image-gen
      name: dsh-image-gen
      config: {}
